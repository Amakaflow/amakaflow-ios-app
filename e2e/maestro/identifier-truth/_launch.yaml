# Shared launch for identifier-truth probes (AMA-2503).
#
# Mock identity plus fixtures, so a probe is deterministic and needs no
# network. The capture runs in AMA-2505 use the real persisted session
# instead; these probes only need the screens to render.
appId: com.myamaka.AmakaFlowCompanion
---
- launchApp:
    clearState: true
    arguments:
      AF_SESSION_IDENTITY: "user_id=user_idtruth,email=claude+clerk_test@amakaflow.dev,name=ID Truth"
      AF_USE_FIXTURES: "1"
      AF_FIXTURE_NAMES: "strength_block_w1"
      AF_SKIP_ONBOARDING: "true"
      AF_SKIP_APPLE_WATCH: "true"
- extendedWaitUntil:
    visible:
      id: "af_tabbar"
    timeout: 30000
