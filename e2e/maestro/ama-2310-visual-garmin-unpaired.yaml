# AMA-2310: Unpaired Start → Garmin is tappable recovery (not dead grey row).
# Opens Devices pairing surface; status copy mentions not paired / Devices / CIQ.
appId: com.myamaka.AmakaFlowCompanion
---
- launchApp:
    clearState: true
    arguments:
      AF_SESSION_IDENTITY: "user_id=user_ama2310_visual,email=claude+clerk_test@amakaflow.dev,name=AMA2310 Visual"
      AF_USE_FIXTURES: "1"
      AF_FIXTURE_NAMES: "strength_block_w1"
      AF_SKIP_ONBOARDING: "true"
      # Explicitly unpaired — no AF_FAULT_GARMIN_PAIRED
- tapOn:
    id: "library_tab"
- tapOn:
    id: "af_library_search"
- inputText: "Strength"
- pressKey: Enter
- extendedWaitUntil:
    visible:
      id: "af_library_results"
    timeout: 10000
- tapOn:
    id: "af_library_item_workout:fixture-strength-001"
- tapOn:
    id: "af_workout_detail_start"
- assertVisible:
    id: "af_start_sheet"
- assertVisible: "Tap to pair CIQ"
- assertVisible: "PAIR"
- tapOn:
    id: "af_start_device_garmin"
- assertVisible:
    id: "devices_screen"
- takeScreenshot: ama-2310-garmin-unpaired-recovery
