# AMA-2286 / AMA-2310: Start → Garmin shows real push status (not stub).
# Device row confirms immediately (no separate confirm control).
# Forced fail: relaunch with AF_FAULT_GARMIN_PUSH_FAIL=not_paired.
appId: com.myamaka.AmakaFlowCompanion
---
- launchApp:
    clearState: true
    arguments:
      AF_SESSION_IDENTITY: "user_id=user_ama2286_visual,email=claude+clerk_test@amakaflow.dev,name=AMA2286 Visual"
      AF_USE_FIXTURES: "1"
      AF_FIXTURE_NAMES: "strength_block_w1"
      AF_SKIP_ONBOARDING: "true"
      AF_FAULT_GARMIN_PAIRED: "1"
- tapOn:
    id: "library_tab"
- tapOn:
    id: "af_library_search"
- inputText: "Strength"
- extendedWaitUntil:
    visible:
      id: "af_library_results"
    timeout: 10000
- tapOn:
    id: "af_library_item_workout:fixture-strength-001"
- tapOn:
    id: "af_workout_detail_start"
- tapOn:
    id: "af_start_device_garmin"
- assertVisible:
    id: "af_workout_detail_handoff_status"
- assertVisible: "Sent to Garmin"
- assertNotVisible: "AMA-2286 push stub"
- takeScreenshot: ama-2286-garmin-handoff-success
---
# Forced failure: unpaired / not_paired recoverable copy
- launchApp:
    clearState: true
    arguments:
      AF_SESSION_IDENTITY: "user_id=user_ama2286_visual,email=claude+clerk_test@amakaflow.dev,name=AMA2286 Visual"
      AF_USE_FIXTURES: "1"
      AF_FIXTURE_NAMES: "strength_block_w1"
      AF_SKIP_ONBOARDING: "true"
      AF_FAULT_GARMIN_PAIRED: "1"
      AF_FAULT_GARMIN_PUSH_FAIL: "not_paired"
- tapOn:
    id: "library_tab"
- tapOn:
    id: "af_library_search"
- inputText: "Strength"
- extendedWaitUntil:
    visible:
      id: "af_library_results"
    timeout: 10000
- tapOn:
    id: "af_library_item_workout:fixture-strength-001"
- tapOn:
    id: "af_workout_detail_start"
- tapOn:
    id: "af_start_device_garmin"
- assertVisible: "not paired"
- assertNotVisible: "AMA-2286 push stub"
- takeScreenshot: ama-2286-garmin-handoff-not-paired
