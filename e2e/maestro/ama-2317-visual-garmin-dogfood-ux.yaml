# AMA-2317 — Garmin post-push dogfood UX.
#
# What we're testing: the Start sheet no longer echoes exact work/rest prefs
# per device — AMA-2371 replaced that per-device "Edit" row with one footer
# pointing to Settings › Connected wearables; after a push the handoff is
# named "opening Garmin Connect" instead of looking like a crash; Devices says
# the pairing lasts until you remove it; and Delete/Remove copy says watch
# copies are not touched.
#
# Externals: no mapper/BFF needed — UITEST fixtures back the push, and
# AF_FAULT_GARMIN_PUSH_FAIL covers the failure branch. Nothing here 500s when
# Garmin Connect Mobile or the CIQ widget are absent.
appId: com.myamaka.AmakaFlowCompanion
---
# 1) The Start sheet points to Settings for watch display defaults instead of
#    a per-device "Edit" row (AMA-2371 removed af_start_garmin_prefs_note).
- launchApp:
    clearState: true
    arguments:
      AF_USE_FIXTURES: "1"
      AF_FIXTURE_NAMES: "strength_block_w1"
      AF_SKIP_ONBOARDING: "true"
      AF_FAULT_GARMIN_PAIRED: "1"
- tapOn:
    id: "library_tab"
- tapOn:
    id: "af_library_search"
- inputText: "Strength"
- extendedWaitUntil:
    visible:
      id: "af_library_results"
    timeout: 10000
- tapOn:
    id: "af_library_item_workout:fixture-strength-001"
- tapOn:
    id: "af_workout_detail_start"
- assertVisible:
    id: "af_start_sheet"
- assertVisible:
    id: "af_start_settings_pointer"
- assertVisible: "Watch display defaults live in Settings"
- assertNotVisible:
    id: "af_start_garmin_prefs_note"
- takeScreenshot: ama-2317-start-sheet-settings-pointer
---
# 2) Push succeeds → handoff is named (compact lime "Sent to Garmin" card),
#    and the "not a crash" reassurance body is shown (AMA-2371 compact card).
- launchApp:
    clearState: true
    arguments:
      AF_USE_FIXTURES: "1"
      AF_FIXTURE_NAMES: "strength_block_w1"
      AF_SKIP_ONBOARDING: "true"
      AF_FAULT_GARMIN_PAIRED: "1"
- tapOn:
    id: "library_tab"
- tapOn:
    id: "af_library_search"
- inputText: "Strength"
- extendedWaitUntil:
    visible:
      id: "af_library_results"
    timeout: 10000
- tapOn:
    id: "af_library_item_workout:fixture-strength-001"
- tapOn:
    id: "af_workout_detail_start"
- tapOn:
    id: "af_start_device_garmin"
- assertVisible:
    id: "af_workout_detail_sent_card_title"
- assertVisible: "Sent to Garmin"
- assertVisible:
    id: "af_workout_detail_handoff_status"
- assertVisible:
    id: "af_workout_detail_sent_card_body"
- assertVisible: "not a crash"
- takeScreenshot: ama-2317-handoff-not-a-crash
---
# 3) Pairing lifecycle + remove semantics on Devices. The fixture service pairs
#    a Forerunner 955, so this covers the paired row caption and the Remove
#    confirmation as well as the pair sheet's one-time-code copy.
- launchApp:
    clearState: true
    arguments:
      AF_USE_FIXTURES: "1"
      AF_FIXTURE_NAMES: "strength_block_w1"
      AF_SKIP_ONBOARDING: "true"
- tapOn:
    id: "library_tab"
- tapOn:
    id: "af_library_search"
- inputText: "Strength"
- extendedWaitUntil:
    visible:
      id: "af_library_results"
    timeout: 10000
- tapOn:
    id: "af_library_item_workout:fixture-strength-001"
- tapOn:
    id: "af_workout_detail_start"
- tapOn:
    id: "af_start_device_garmin"
- assertVisible:
    id: "devices_screen"
- assertVisible:
    id: "af_devices_pairing_lifecycle_note"
- assertVisible: "one-time"
- assertVisible: "until you remove"
- assertVisible: "on the watch itself"
# The paired row itself says the pairing survives — not just the footer note.
- assertVisible:
    id: "af_device_pairing_status_fixture-garmin-955"
- assertVisible: "stays paired until you remove it"
- takeScreenshot: ama-2317-devices-pairing-lifecycle
# Remove on a paired device = unpair only; the watch keeps its downloads.
- tapOn:
    id: "af_device_remove_fixture-garmin-955"
- assertVisible: "Remove this device?"
- assertVisible: "unpairs the watch from AmakaFlow only"
- assertVisible: "Strength Workouts"
- assertVisible: "new 6-digit code"
- takeScreenshot: ama-2317-remove-device-unpair-only
- tapOn: "Cancel"
# The device must still be there — Cancel cannot unpair.
- assertVisible:
    id: "device_card_fixture-garmin-955"
- tapOn:
    id: "af_devices_add"
- assertVisible:
    id: "af_device_pair_lifecycle_note"
- takeScreenshot: ama-2317-pair-sheet-one-time-code
---
# 4) Library delete says the watch copy survives.
- launchApp:
    clearState: true
    arguments:
      AF_USE_FIXTURES: "1"
      AF_FIXTURE_NAMES: "strength_block_w1"
      AF_SKIP_ONBOARDING: "true"
- tapOn:
    id: "library_tab"
- tapOn:
    id: "af_library_search"
- inputText: "Strength"
- extendedWaitUntil:
    visible:
      id: "af_library_results"
    timeout: 10000
- tapOn:
    id: "af_library_item_workout:fixture-strength-001"
- tapOn:
    id: "af_workout_detail_delete_icon"
- assertVisible: "Delete from Library?"
- assertVisible: "Strength Workouts"
- takeScreenshot: ama-2317-delete-scope-copy
- tapOn: "Cancel"
