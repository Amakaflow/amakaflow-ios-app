# AMA-2383 — DD Toast via Set as active gym
appId: com.myamaka.AmakaFlowCompanion
---
- launchApp:
    clearState: true
    permissions:
      notifications: deny
    arguments:
      UITEST_CLERK_TEST_SESSION: "user_id=user_ama2383_gym,email=claude+clerk_test@amakaflow.dev,name=AMA2383 Gym"
      UITEST_SKIP_ONBOARDING: "true"
      UITEST_SKIP_APPLE_WATCH: "true"
      UITEST_USE_FIXTURES: "true"
- waitForAnimationToEnd:
    timeout: 5000
- extendedWaitUntil:
    visible:
      id: "af_tabbar"
    timeout: 60000
- tapOn: "Profile"
- waitForAnimationToEnd:
    timeout: 3000
- scrollUntilVisible:
    element:
      text: "My Gyms"
    direction: DOWN
    timeout: 10000
- tapOn: "My Gyms"
- waitForAnimationToEnd:
    timeout: 3000
- extendedWaitUntil:
    visible:
      id: "dd_gym_detail_screen"
    timeout: 15000
- tapOn:
    id: "dd_gym_set_active"
- extendedWaitUntil:
    visible: "Active gym saved locally"
    timeout: 5000
- takeScreenshot: docs/ama-2383-dogfood/04-dd-toast-after-save
- assertVisible: "Active gym saved locally"
