name: Claude auto-fix bot reviews

on:
  pull_request_review:
    types: [submitted]

permissions:
  contents: read

concurrency:
  group: claude-fix-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  auto-fix:
    if: >
      (github.event.review.state == 'changes_requested' ||
       github.event.review.state == 'commented') &&
      (github.event.review.user.login == 'factory-droid[bot]' ||
       github.event.review.user.login == 'droid-review[bot]' ||
       github.event.review.user.login == 'coderabbitai[bot]')
    runs-on: ubuntu-latest
    # AMA-2448 — this job has never had a passing run; the credential is
    # rejected before any work happens. Non-blocking so a broken bot does not
    # show red on every PR. REMOVE THIS once a run completes with is_error:false
    # — until then a genuinely failing auto-fix is invisible.
    continue-on-error: true
    timeout-minutes: 30
    permissions:
      contents: write
      pull-requests: write
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
          persist-credentials: false

      - name: Claude Code fix review comments
        uses: anthropics/claude-code-action@6b082c41935b4c8a3b8b0ef85ba4ba4d9eeb8975 # v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          allowed_bots: "factory-droid[bot],droid-review[bot],coderabbitai[bot]"
          trigger_phrase: ""
          prompt: |
            A code reviewer has requested changes on this PR. Read ALL review comments carefully. For each comment:
            1. VERIFY the finding against the current code first — reviewers can be wrong, and blindly "fixing" a wrong finding breaks working code. Skip invalid findings and reply explaining why.
            2. Make each valid fix in the correct file — fix the CODE the comment is about; NEVER weaken or rewrite a test to make a finding go away, and NEVER add XCTExpectFailure.
            3. If a comment is just a question or suggestion, respond explaining your reasoning.

            Verify before claiming done: run the relevant local checks (shellcheck/actionlint for .github changes; for Swift changes state clearly that compilation is unverified in CI-only context). Do not edit the PR body's validation claims.

            After making all fixes, commit with message: "fix: address review feedback"
